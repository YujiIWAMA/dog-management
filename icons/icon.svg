  <path d="M322 148 C352 150 368 182 366 222 C364 262 360 292 346 316 C340 326 330 320 330 310 C324 320 312 316 314 304 C304 306 302 292 308 284 C304 262 308 234 316 214 C320 196 316 168 322 148 Z" fill="url(#ear)"/>
