<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わんこ手帳</title>
<meta name="theme-color" content="#3A2E28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="わんこ手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F1; --card:#FFFFFF; --ink:#2B2420; --sub:#7A6E66; --line:#ECE4DA;
  --tan:#B5652A; --tan-soft:#F5E6D8; --brown:#3A2E28;
  --green:#5B8C51; --green-soft:#E4EFDF; --blue:#4A78A8; --blue-soft:#E1EAF4;
  --pink:#C9576F; --pink-soft:#F8E3E8; --danger:#B3402F;
  --shadow:0 1px 2px rgba(58,46,40,.06),0 4px 14px rgba(58,46,40,.06);
  --radius:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1C1815; --card:#272220; --ink:#F2EBE4; --sub:#A99C92; --line:#3A332E;
    --tan:#E09A62; --tan-soft:#3D2C20; --brown:#120F0D;
    --green:#8DBF82; --green-soft:#24331F; --blue:#86AEDA; --blue-soft:#1F2A37;
    --pink:#E48A9D; --pink-soft:#3A2228; --danger:#E8735F;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:16px;line-height:1.55;
  min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.hidden{display:none!important}

/* header */
.hero{background:var(--brown);color:#FBF2E8;padding:calc(14px + var(--safe-t)) 18px 18px;
  border-radius:0 0 26px 26px;display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#5a4a40;flex:none;
  border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:30px}
.hero h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}
.hero .age{font-size:14px;opacity:.85}
.hero .days{margin-top:4px;display:inline-block;background:rgba(224,154,98,.22);color:#F3C9A4;
  padding:2px 10px;border-radius:99px;font-size:13px;font-weight:500}
.hero .days b{font-size:16px}

main{padding:16px 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head .m{font-size:20px;font-weight:700}
.cal-head .m small{font-size:14px;color:var(--sub);font-weight:500;margin-left:4px}
.iconbtn{border:0;background:var(--tan-soft);color:var(--tan);width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;font-size:18px;font-weight:700}
.textbtn{border:0;background:none;color:var(--tan);font-weight:700;font-size:14px;padding:6px 8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow{font-size:12px;color:var(--sub);padding:4px 0}
.dow.sun{color:var(--pink)} .dow.sat{color:var(--blue)}
.day{border:0;background:none;padding:4px 0 2px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.day .n{width:30px;height:30px;line-height:30px;border-radius:50%;font-size:15px}
.day.out .n{color:var(--sub);opacity:.45}
.day.sun .n{color:var(--pink)} .day.sat .n{color:var(--blue)}
.day.today .n{box-shadow:inset 0 0 0 2px var(--tan);font-weight:700}
.day.sel .n{background:var(--tan);color:#fff!important;font-weight:700}
.marks{display:flex;gap:3px;height:12px;align-items:center;font-size:10px;line-height:1}
.dot{width:6px;height:6px;border-radius:50%}
.dot.weight{background:var(--tan)} .dot.food{background:var(--green)} .dot.event{background:var(--blue)}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}

/* day detail */
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dayhead .d{font-size:18px;font-weight:700}
.dayhead .w{color:var(--sub);font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.quick button{border:0;border-radius:14px;padding:10px 4px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick .i{font-size:22px;line-height:1.1}
.q-weight{background:var(--tan-soft);color:var(--tan)}
.q-food{background:var(--green-soft);color:var(--green)}
.q-event{background:var(--blue-soft);color:var(--blue)}
.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.item .ic.weight{background:var(--tan-soft)} .item .ic.food{background:var(--green-soft)}
.item .ic.event{background:var(--blue-soft)} .item .ic.special{background:var(--pink-soft)}
.item .t{font-weight:700;font-size:15px}
.item .s{color:var(--sub);font-size:13px}
.item .body{flex:1;min-width:0}
.item .body .t,.item .body .s{overflow-wrap:anywhere}
.item.tap{cursor:pointer}
.empty{color:var(--sub);font-size:14px;padding:6px 4px}

/* weight */
.wnow{display:flex;align-items:baseline;gap:8px}
.wnow .big{font-size:40px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.wnow .unit{font-size:18px;color:var(--sub)}
.delta{font-size:14px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.delta.up{color:var(--tan);background:var(--tan-soft)} .delta.down{color:var(--blue);background:var(--blue-soft)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:12px 0 8px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:10px;font-size:14px;font-weight:500;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.chartbox{position:relative;height:240px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-size:16px}
.stats span{font-size:12px;color:var(--sub)}
.primary{border:0;background:var(--tan);color:#fff;font-weight:700;border-radius:14px;padding:13px 16px;width:100%;font-size:16px}
.secondary{border:1.5px solid var(--line);background:var(--card);font-weight:700;border-radius:14px;padding:11px 16px;width:100%;font-size:15px}
.danger{border:0;background:none;color:var(--danger);font-weight:700;padding:12px;width:100%}

/* profile */
.prof{display:flex;gap:14px;align-items:center}
.prof .avatar{width:84px;height:84px;font-size:40px;border-color:var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-top:12px}
.kv dt{color:var(--sub)} .kv dd{margin:0}
.food-now{display:flex;gap:12px;align-items:center;background:var(--green-soft);border-radius:14px;padding:12px}
.food-now .i{font-size:28px}
.food-now .t{font-weight:700}
.food-now .s{font-size:13px;color:var(--sub)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.18em;background:var(--bg);
  border-radius:12px;padding:10px;text-align:center;margin:8px 0}
.note{font-size:13px;color:var(--sub)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);z-index:20}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:12px;color:var(--sub);font-weight:500}
nav.tabs .i{font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--tan);font-weight:700}
nav.tabs button.on .i{filter:none;opacity:1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,14,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));
  max-height:90vh;overflow:auto;animation:up .2s ease}
.sheet h3{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:500;margin:10px 0 4px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--tan)}
.inline{display:flex;gap:8px;align-items:center}
.inline .inp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{border-color:var(--tan);background:var(--tan-soft);color:var(--tan);font-weight:700}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;animation:fade .2s}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:14px}
.login .logo{font-size:64px}
.login h1{margin:0;font-size:26px}
.login .primary,.login .secondary{max-width:320px}
.demo-banner{background:var(--tan-soft);color:var(--tan);font-size:12px;text-align:center;padding:4px;font-weight:500}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner hidden">デモモード（この端末だけに保存）— Firebase設定後に共有できます</div>

<!-- ログイン / 家族設定 -->
<div id="login" class="login hidden">
  <div class="logo">🐾</div>
  <h1>わんこ手帳</h1>
  <p class="note">体重・ごはん・予定を夫婦で共有</p>
  <button class="primary" id="btnLogin">Googleでログイン</button>
</div>

<div id="setup" class="login hidden">
  <div class="logo">🏠</div>
  <h1>はじめに</h1>
  <p class="note">最初の1人が「新しく始める」、<br>もう1人は表示された招待コードで参加します。</p>
  <button class="primary" id="btnCreate">新しく始める</button>
  <div style="width:100%;max-width:320px">
    <label class="f">招待コードで参加</label>
    <div class="inline"><input class="inp" id="joinCode" placeholder="例：K7PQ2MXA" autocapitalize="characters" maxlength="8">
    <button class="secondary" style="width:auto" id="btnJoin">参加</button></div>
  </div>
  <button class="textbtn" id="btnLogout0">ログアウト</button>
</div>

<!-- 本体 -->
<div id="app" class="hidden">
  <header class="hero">
    <div class="wrap row" style="width:100%">
      <div class="avatar" id="heroAvatar">🐶</div>
      <div style="min-width:0">
        <h1 id="heroName">わんこ</h1>
        <div class="age" id="heroAge"></div>
        <div class="days" id="heroDays"></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- カレンダー -->
    <section id="view-cal">
      <div class="card">
        <div class="cal-head">
          <button class="iconbtn" id="prevM" aria-label="前の月">‹</button>
          <div class="m" id="calTitle"></div>
          <button class="iconbtn" id="nextM" aria-label="次の月">›</button>
        </div>
        <div class="grid" id="calDow"></div>
        <div class="grid" id="calGrid"></div>
        <div class="legend">
          <span><i class="dot weight"></i>体重</span><span><i class="dot food"></i>ごはん</span>
          <span><i class="dot event"></i>予定</span><span>🎂 誕生日</span><span>🏠 記念日</span>
        </div>
      </div>
      <div class="card">
        <div class="dayhead"><span class="d" id="selTitle"></span><span class="w" id="selSub"></span>
          <span class="spacer"></span><button class="textbtn" id="btnToday">今日</button></div>
        <div id="selList"></div>
        <div class="quick">
          <button class="q-weight" data-add="weight"><span class="i">⚖️</span>体重</button>
          <button class="q-food" data-add="food"><span class="i">🍚</span>ごはん変更</button>
          <button class="q-event" data-add="event"><span class="i">📅</span>予定・メモ</button>
        </div>
      </div>
      <div class="card">
        <h2>これからの予定</h2>
        <div id="upcoming"></div>
      </div>
    </section>

    <!-- 体重 -->
    <section id="view-weight" class="hidden">
      <div class="card">
        <h2>いまの体重</h2>
        <div class="wnow"><span class="big" id="wNow">—</span><span class="unit">kg</span><span class="spacer"></span><span class="delta" id="wDelta"></span></div>
        <div class="note" id="wNowDate"></div>
        <div class="seg" id="rangeSeg">
          <button data-r="1">1ヶ月</button><button data-r="6">半年</button><button data-r="12">1年</button><button data-r="0">全期間</button>
        </div>
        <div class="chartbox"><canvas id="wChart"></canvas></div>
        <div class="stats" id="wStats"></div>
        <div class="btns"><button class="primary" data-add="weight">⚖️ 体重を記録</button></div>
      </div>
      <div class="card">
        <h2>記録一覧</h2>
        <div id="wList"></div>
      </div>
    </section>

    <!-- プロフィール -->
    <section id="view-pet" class="hidden">
      <div class="card">
        <div class="prof">
          <div class="avatar" id="profAvatar">🐶</div>
          <div class="spacer">
            <div style="font-size:22px;font-weight:700" id="profName"></div>
            <div class="note" id="profAge"></div>
          </div>
          <button class="textbtn" id="btnEditPet">編集</button>
        </div>
        <dl class="kv" id="profKv"></dl>
      </div>
      <div class="card">
        <h2>ごはん</h2>
        <div id="foodNow"></div>
        <div class="btns"><button class="secondary" data-add="food">🍚 ごはんを変更</button></div>
        <div id="foodHist" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h2>家族と共有</h2>
        <p class="note" style="margin:0">この招待コードを家族に送ると、同じ記録を見て書き込めます。</p>
        <div class="code" id="famCode">—</div>
        <div class="btns" style="margin-top:4px"><button class="secondary" id="btnShare">招待リンクを送る</button></div>
        <p class="note" id="famMembers"></p>
      </div>
      <button class="danger" id="btnLogout">ログアウト</button>
    </section>
  </main>

  <nav class="tabs">
    <div class="wrap">
      <button data-tab="cal" class="on"><span class="i">📅</span>カレンダー</button>
      <button data-tab="weight"><span class="i">⚖️</span>体重</button>
      <button data-tab="pet"><span class="i">🐶</span><span id="tabPetName">プロフィール</span></button>
    </div>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* =========================================================
   ① Firebaseの設定値をここに貼り付け（家計簿と同じ手順）
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB9EnkwijfhTDH18s5R2FnBfshUnJwYt6c",
  authDomain: "dog-management-2c721.firebaseapp.com",
  projectId: "dog-management-2c721",
  storageBucket: "dog-management-2c721.firebasestorage.app",
  messagingSenderId: "355226438531",
  appId: "1:355226438531:web:1e0300dd841ad9c9e8c4b6"
};
const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("YOUR");

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayIso = () => iso(new Date());
const DOW = ["日","月","火","水","木","金","土"];
const fmtJ = s => { const d = parse(s); return `${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`; };
const fmtFull = s => { if(!s) return "—"; const d = parse(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const dim = (y, m) => new Date(y, m+1, 0).getDate();
const kg = g => (g/1000).toFixed(2);
const uid8 = () => { const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(8)); r.forEach(x=>s+=a[x%a.length]); return s; };
function ageText(birth, on = todayIso()){
  if(!birth) return "";
  const b = parse(birth), t = parse(on);
  let y = t.getFullYear()-b.getFullYear(), m = t.getMonth()-b.getMonth(), d = t.getDate()-b.getDate();
  if(d < 0){ m--; d += dim(t.getFullYear(), t.getMonth()-1); }
  if(m < 0){ y--; m += 12; }
  if(y < 0) return "";
  return `${y}歳${m}か月${d}日`;
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

const EVENT_KINDS = [
  {k:"hospital", e:"🏥", n:"病院"}, {k:"vaccine", e:"💉", n:"ワクチン"}, {k:"medicine", e:"💊", n:"お薬"},
  {k:"trim", e:"✂️", n:"トリミング"}, {k:"health", e:"🩺", n:"体調メモ"}, {k:"fun", e:"🎉", n:"おでかけ"}, {k:"other", e:"🐾", n:"その他"}
];
const kindOf = k => EVENT_KINDS.find(x => x.k === k) || EVENT_KINDS[EVENT_KINDS.length-1];

/* ---------- state ---------- */
const S = { pet: {}, records: [], month: null, sel: todayIso(), range: 6, tab: "cal", familyId: null, members: [] };
{ const t = new Date(); S.month = new Date(t.getFullYear(), t.getMonth(), 1); }

/* ---------- storage layer (Firebase / demo) ---------- */
let store;
function demoStore(){
  const KEY = "wanko-demo";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } };
  let db = load();
  if(!db){
    db = { pet: { name:"ぷーある", sex:"female", breed:"ミニチュアダックスフンド", birthday:"2024-09-20", adopted:"2025-03-23" }, records: [] };
    const seed = [["2026-07-09",4330],["2026-08-01",4550],["2026-08-22",4550],["2026-08-29",4750],["2026-09-06",4650],["2026-09-21",5050],["2026-10-07",4900]];
    seed.forEach(([d,g],i) => db.records.push({ id:"w"+i, type:"weight", date:d, grams:g }));
    db.records.push({ id:"f0", type:"food", date:"2026-07-01", name:"ロイヤルカナン ダックスフンド", amount:"38g × 2回" });
    db.records.push({ id:"e0", type:"event", date:"2026-10-24", kind:"vaccine", title:"混合ワクチン", note:"" });
  }
  const subs = { pet: [], rec: [] };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} subs.pet.forEach(f=>f(db.pet)); subs.rec.forEach(f=>f(db.records)); };
  return {
    onPet: f => { subs.pet.push(f); f(db.pet); },
    onRecords: f => { subs.rec.push(f); f(db.records); },
    savePet: p => { db.pet = { ...db.pet, ...p }; save(); },
    add: r => { db.records.push({ ...r, id: "r"+Date.now() }); save(); },
    update: (id, r) => { db.records = db.records.map(x => x.id === id ? { ...x, ...r } : x); save(); },
    remove: id => { db.records = db.records.filter(x => x.id !== id); save(); }
  };
}
function fbStore(fs, fid){
  const fam = fs.collection("families").doc(fid);
  const recs = fam.collection("records");
  const me = firebase.auth().currentUser;
  return {
    onPet: f => fam.onSnapshot(s => { const d = s.data() || {}; S.members = d.members || []; f(d.pet || {}); }),
    onRecords: f => recs.onSnapshot(q => f(q.docs.map(d => ({ id: d.id, ...d.data() })))),
    savePet: p => fam.set({ pet: p }, { merge: true }),
    add: r => recs.add({ ...r, by: me?.displayName || "", at: firebase.firestore.FieldValue.serverTimestamp() }),
    update: (id, r) => recs.doc(id).update(r),
    remove: id => recs.doc(id).delete()
  };
}

// 誕生日・お迎え記念日・お迎え100日ごと（保存せずに自動表示）
function specialsOn(dateStr){
  const out = [], p = S.pet, d = parse(dateStr), name = p.name || "わんこ";
  const md = s => s && s.slice(5);
  if(p.birthday && md(p.birthday) === dateStr.slice(5) && dateStr > p.birthday){
    out.push({ e:"🎂", t:`${name}の誕生日`, s:`${d.getFullYear() - parse(p.birthday).getFullYear()}歳` });
  }
  if(p.adopted && md(p.adopted) === dateStr.slice(5) && dateStr > p.adopted){
    out.push({ e:"🏠", t:"うちの子記念日", s:`お迎えから${d.getFullYear() - parse(p.adopted).getFullYear()}年` });
  }
  if(p.adopted){ const n = daysBetween(p.adopted, dateStr); if(n > 0 && n % 100 === 0) out.push({ e:"🏠", t:`お迎え${n}日`, s:"" }); }
  return out;
}
function recordsOn(dateStr){
  const order = { weight:0, food:1, event:2 };
  return S.records.filter(r => r.date === dateStr).sort((a,b) => order[a.type]-order[b.type] || (a.time||"").localeCompare(b.time||""));
}

function renderCal(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  $("#calTitle").innerHTML = `${mo+1}月<small>${y}</small>`;
  $("#calDow").innerHTML = DOW.map((d,i) => `<div class="dow ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("");
  const start = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());
  const byDate = {};
  S.records.forEach(r => { (byDate[r.date] ||= new Set()).add(r.type); });
  const t = todayIso();
  let h = "";
  const weeks = Math.ceil((new Date(y, mo, 1).getDay() + dim(y, mo)) / 7);
  for(let i = 0; i < weeks * 7; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), s = iso(d);
    const set = byDate[s] || new Set(), sp = specialsOn(s);
    const marks = ["weight","food","event"].filter(k => set.has(k)).map(k => `<i class="dot ${k}"></i>`).join("")
      + sp.slice(0,1).map(x => `<span>${x.e}</span>`).join("");
    const cls = ["day", d.getMonth() !== mo ? "out" : "", d.getDay()===0 ? "sun" : d.getDay()===6 ? "sat" : "", s===t ? "today" : "", s===S.sel ? "sel" : ""].join(" ");
    h += `<button class="${cls}" data-d="${s}"><span class="n">${d.getDate()}</span><span class="marks">${marks}</span></button>`;
  }
  $("#calGrid").innerHTML = h;
  renderDay(); renderUpcoming();
}

/* ---------- render: weight ---------- */
let chart;
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function renderWeight(){
  const w = weights();
  $$("#rangeSeg button").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === S.range));
  if(!w.length){
    $("#wNow").textContent = "—"; $("#wDelta").textContent = ""; $("#wDelta").className = "delta hidden";
    $("#wNowDate").textContent = "まだ記録がありません"; $("#wStats").innerHTML = ""; $("#wList").innerHTML = `<div class="empty">記録はありません</div>`;
    if(chart){ chart.destroy(); chart = null; } return;
  }
  const last = w[w.length-1], prev = w[w.length-2];
  $("#wNow").textContent = kg(last.grams);
  $("#wNowDate").textContent = `${fmtFull(last.date)} 計測（${last.grams.toLocaleString()} g）`;
  const dEl = $("#wDelta");
  if(prev){ const diff = last.grams - prev.grams; dEl.className = "delta " + (diff>0?"up":diff<0?"down":""); dEl.textContent = `前回比 ${diff>0?"+":diff<0?"−":"±"}${Math.abs(diff)} g`; }
  else dEl.className = "delta hidden";

  // 期間
  const end = parse(todayIso());
  let start;
  if(S.range === 0){ start = parse(w[0].date); }
  else { start = new Date(end); start.setMonth(start.getMonth() - S.range); }
  const pts = w.filter(r => parse(r.date) >= start);
  const before = w.filter(r => parse(r.date) < start).pop();
  // 期間の直前の点も入れて、左端から線がつながるようにする
  const data = (before ? [before, ...pts] : pts).map(r => ({ x: parse(r.date).getTime(), y: r.grams/1000 }));
  // 小さな変化が大げさに見えないよう、縦軸は最低0.4kg幅
  const yv = data.map(d => d.y), mid = yv.length ? (Math.max(...yv) + Math.min(...yv)) / 2 : 0;
  if(S.range === 0 && start.getTime() === end.getTime()) start.setDate(start.getDate() - 7);

  const ys = pts.map(r => r.grams);
  $("#wStats").innerHTML = ys.length ? `
    <div><b>${kg(Math.max(...ys))}</b><span>最高 kg</span></div>
    <div><b>${kg(Math.min(...ys))}</b><span>最低 kg</span></div>
    <div><b>${(() => { const base = before ? before.grams : ys[0]; const d = ys[ys.length-1]-base; return (d>0?"+":d<0?"−":"±")+Math.abs(d); })()}</b><span>期間の増減 g</span></div>` : `<div style="grid-column:1/-1"><span>この期間の記録はありません</span></div>`;

  const day = 86400000, span = (end - start) / day;
  const step = span <= 40 ? 7 : span <= 200 ? 30 : span <= 400 ? 61 : Math.ceil(span/6/30)*30;
  const tan = css("--tan"), sub = css("--sub"), line = css("--line"), card = css("--card");
  const cfg = {
    type: "line",
    data: { datasets: [{ data, borderColor: tan, backgroundColor: tan + "22", fill: true, cubicInterpolationMode: "monotone", borderWidth: 2.5,
      pointRadius: data.length > 40 ? 0 : 4, clip: 4, pointHoverRadius: 6, pointBackgroundColor: card, pointBorderColor: tan, pointBorderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { right: 8 } },
      plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: {
        title: it => { const d = new Date(it[0].parsed.x); return `${d.getMonth()+1}/${d.getDate()}`; },
        label: it => `${it.parsed.y.toFixed(2)} kg` } } },
      scales: {
        x: { type: "linear", min: start.getTime(), max: end.getTime(), grid: { color: line }, border: { display: false },
          ticks: { color: sub, stepSize: step * day, maxRotation: 0, autoSkip: true, maxTicksLimit: 6,
            callback: v => { const d = new Date(v); return span > 400 ? `${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}` : `${d.getMonth()+1}/${d.getDate()}`; } } },
        y: { grace: "15%", suggestedMin: mid - .2, suggestedMax: mid + .2, grid: { color: line }, border: { display: false }, ticks: { color: sub, maxTicksLimit: 6, callback: v => (Math.round(v*100) % 10 ? v.toFixed(2) : v.toFixed(1)) } }
      }
    }
  };
  if(chart) chart.destroy();
  if(window.Chart) chart = new Chart($("#wChart"), cfg);

  $("#wList").innerHTML = w.slice().reverse().map((r, i, arr) => {
    const p = arr[i+1], diff = p ? r.grams - p.grams : null;
    return `<div class="item tap" data-edit="${r.id}"><div class="ic weight">⚖️</div><div class="body"><div class="t">${kg(r.grams)} kg</div><div class="s">${fmtFull(r.date)}${r.note?"・"+esc(r.note):""}</div></div>
      ${diff===null?"":`<span class="note">${diff>0?"+":diff<0?"−":"±"}${Math.abs(diff)}g</span>`}</div>`;
  }).join("");
}

function openSheet(html, onMount){
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  sc.addEventListener("click", e => { if(e.target === sc) sc.remove(); });
  document.body.appendChild(sc);
  const close = () => sc.remove();
  sc.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  onMount && onMount(sc.querySelector(".sheet"), close);
}

function resizePhoto(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const N = 320, c = document.createElement("canvas"); c.width = c.height = N;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, N, N);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = rej; img.src = url;
  });
}

    el.querySelector("#pPhoto").onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      try { photo = await resizePhoto(f); el.querySelector("#pAv").innerHTML = `<img src="${photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`; }
      catch(_) { toast("写真を読み込めませんでした"); }
    };
    el.querySelector("#pSave").onclick = () => {
      store.savePet({ name: el.querySelector("#pName").value.trim(), breed: el.querySelector("#pBreed").value.trim(), sex,
        birthday: el.querySelector("#pBirth").value, adopted: el.querySelector("#pAdopt").value, photo });
      close(); toast("保存しました");
    };
  });
}

/* ---------- events ---------- */
function openAdd(type, rec){ ({ weight: weightForm, food: foodForm, event: eventForm })[type](rec); }
document.addEventListener("click", e => {
  const add = e.target.closest("[data-add]"); if(add){ openAdd(add.dataset.add); return; }
  const ed = e.target.closest("[data-edit]"); if(ed){ const r = S.records.find(x => x.id === ed.dataset.edit); if(r) openAdd(r.type, r); return; }
  const day = e.target.closest(".day"); if(day){
    S.sel = day.dataset.d; const d = parse(S.sel);
    if(d.getMonth() !== S.month.getMonth()) S.month = new Date(d.getFullYear(), d.getMonth(), 1);
    renderCal(); return;
  }
  const tab = e.target.closest("[data-tab]"); if(tab){
    S.tab = tab.dataset.tab;
    $$("nav.tabs button").forEach(b => b.classList.toggle("on", b === tab));
    ["cal","weight","pet"].forEach(t => $("#view-"+t).classList.toggle("hidden", t !== S.tab));
    window.scrollTo(0, 0); renderAll(); return;
  }
  const r = e.target.closest("#rangeSeg button"); if(r){ S.range = Number(r.dataset.r); renderWeight(); }
});
$("#prevM").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); renderCal(); };
$("#nextM").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); renderCal(); };
$("#btnToday").onclick = () => { const t = new Date(); S.sel = iso(t); S.month = new Date(t.getFullYear(), t.getMonth(), 1); renderCal(); };
$("#btnEditPet").onclick = petForm;
$("#profAvatar").onclick = petForm;
// スワイプで月移動
(() => { let x0 = null; const g = $("#calGrid");
  g.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  g.addEventListener("touchend", e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 60) (dx < 0 ? $("#nextM") : $("#prevM")).click(); });
})();

/* ---------- boot ---------- */
function startApp(){
  $("#login").classList.add("hidden"); $("#setup").classList.add("hidden"); $("#app").classList.remove("hidden");
  store.onPet(p => { S.pet = p || {}; renderAll(); });
  store.onRecords(r => { S.records = r; renderAll(); });
}
function show(id){ ["login","setup","app"].forEach(x => $("#"+x).classList.toggle("hidden", x !== id)); }

if(DEMO){
  $("#demoBanner").classList.remove("hidden");
  $("#btnLogout").classList.add("hidden");
  store = demoStore(); startApp();
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  const joinParam = new URLSearchParams(location.search).get("join");
  if(joinParam) $("#joinCode").value = joinParam.toUpperCase();

  $("#btnLogin").onclick = async () => {
    const pv = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(pv); }
    catch(e){ if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(pv); else toast("ログインできませんでした"); }
  };
  const logout = () => { if(confirm("ログアウトしますか？")) auth.signOut().then(() => location.reload()); };
  $("#btnLogout").onclick = logout; $("#btnLogout0").onclick = () => auth.signOut();

  const enter = fid => { S.familyId = fid; store = fbStore(fs, fid); startApp(); };

  $("#btnCreate").onclick = async () => {
    const u = auth.currentUser, fid = uid8();
    try {
      await fs.collection("families").doc(fid).set({ members: [u.uid], pet: {}, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      await fs.collection("users").doc(u.uid).set({ familyId: fid });
      enter(fid);
    } catch(e){ console.error(e); toast("作成できませんでした"); }
  };
  $("#btnJoin").onclick = async () => {
    const u = auth.currentUser, fid = $("#joinCode").value.trim().toUpperCase();
    if(fid.length !== 8) return toast("8文字のコードを入力してください");
    try {
      await fs.collection("families").doc(fid).update({ members: firebase.firestore.FieldValue.arrayUnion(u.uid) });
      await fs.collection("users").doc(u.uid).set({ familyId: fid });
      history.replaceState(null, "", location.pathname);
      enter(fid); toast("参加しました");
    } catch(e){ console.error(e); toast("コードが見つかりません"); }
  };
  $("#btnShare").onclick = async () => {
    const url = `${location.origin}${location.pathname}?join=${S.familyId}`;
    const text = `わんこ手帳の招待コード：${S.familyId}\n${url}`;
    if(navigator.share){ try { await navigator.share({ title: "わんこ手帳", text, url }); } catch(_){} }
    else { await navigator.clipboard.writeText(text); toast("コピーしました"); }
  };

  auth.onAuthStateChanged(async u => {
    if(!u){ show("login"); return; }
    try {
      const doc = await fs.collection("users").doc(u.uid).get();
      const fid = doc.exists && doc.data().familyId;
      if(fid && !joinParam) enter(fid);
      else show("setup");
    } catch(e){ console.error(e); show("setup"); }
  });
}

if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
